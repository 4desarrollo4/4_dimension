<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!--
			Estas etiquetas son el FALLBACK que ven los rastreadores que no ejecutan
			JavaScript. El prerender (tools/prerender.js) las reemplaza por las de
			cada ruta en el build; lo que queda aquí es lo que se sirve si algo
			falla. Nunca dejes este bloque vacío.
		-->
		<title>4D Cuarta Dimensión — Diseño y desarrollo de producto: calzado, ropa y dotaciones</title>
		<meta
			name="description"
			content="4D Cuarta Dimensión ES S.A.S. es una comercializadora internacional colombiana de diseño y desarrollo de producto: calzado, ropa y dotaciones corporativas e industriales."
		/>

		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="theme-color" content="#0a0c14" />

		<!--
			Manrope variable: un solo archivo cubre los pesos 400–800. Antes entraba
			por @import dentro del CSS, que bloquea el render y encadena dos
			peticiones. Ver docs/06-backlog.md → P2-01.
		-->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap"
		/>

		<!--
			Sin JavaScript, las secciones que entran al hacer scroll se quedarían en
			opacity: 0. El HTML ya viene prerenderizado, así que aquí solo hay que
			revelarlo.
		-->
		<noscript>
			<style>
				[data-reveal] {
					opacity: 1 !important;
					transform: none !important;
				}
			</style>
		</noscript>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
