<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!--
			Estas etiquetas son el FALLBACK que ven los rastreadores que no ejecutan
			JavaScript. El prerender (tools/prerender.js) las reemplaza por las de
			cada ruta en el build; lo que queda aquí es lo que se sirve si algo
			falla. Nunca dejes este bloque vacío.
		-->
		<title>4D Cuarta Dimensión | Diseño y desarrollo de producto</title>
		<meta
			name="description"
			content="Comercializadora internacional colombiana de diseño y desarrollo de producto: calzado, ropa y dotaciones corporativas e industriales."
		/>

		<!--
			max-image-preview:large permite a Google mostrar la imagen grande en
			resultados y en Discover. Sin esto se queda en miniatura.
		-->
		<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

		<!-- El .ico va primero: es la ruta que rastreadores y navegadores viejos
		     prueban por costumbre, y sin él /favicon.ico devolvía 404. -->
		<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#0a0c14" />

		<!--
			Manrope variable: un solo archivo cubre los pesos 400–800. Antes entraba
			por @import dentro del CSS, que bloquea el render y encadena dos
			peticiones. Ver docs/06-backlog.md → P2-01.
		-->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap"
		/>

		<!--
			Sin JavaScript, las secciones que entran al hacer scroll se quedarían en
			opacity: 0. El HTML ya viene prerenderizado, así que aquí solo hay que
			revelarlo.
		-->
		<noscript>
			<style>
				[data-reveal] {
					opacity: 1 !important;
					transform: none !important;
				}
			</style>
		</noscript>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
